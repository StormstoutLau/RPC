# ═══════════════════════════════════════════════════════════════════════════
# projects.yaml — **项目注册表**（`$PROJECTS` 的唯一真值）
#
# 为什么存在（2026-10-13）：此前 `$PROJECTS` 是 `agent-cli.ps1` 的**硬编码常量表**
#   ⇒ **接入一个仓库 = 改内核关键路径**（ADR-0013 §「两个前置」①点名要防的形态）。
#   本表把它变成**数据**：新增 = 追加一条；退役 = 改 `retired` 不删（同 `namespaces.yaml` 范式）。
#
# ★★ `id` = **调用方逐字使用的键**（`agent-cli <cmd> <id>`）**兼站上工作区目录名**
#   ⇒ **不许改造/归一化**（会破坏所有既有调用点与既有工作区）。
#   故本表的 id 与 2026-09-23 的硬编码**逐字相同**（`paper` / `Cpp_Hub` / `Auto_Prover` / `dogfood`）
#   —— ⚠ 与 `namespaces.yaml`（id 取小写规范名）**不同**：那是**身份轴**，这是**调用轴**。
#
# ★ root 一律**单引号**括起（含 `\` 的 Windows 路径）。
# ⚠ 本表**只登记**，**不判 root 存在性** —— `F:` / `E:` 等外盘可能离线，
#   判存在性会让门禁**常红（假红）**；存在性由 `workspace create` 在使用时 `Test-Path` 判。
#
# 治理三规则（可机判，见 `ops/rpc_check.py` 的 `validate_projects`）：
#   ① 新增 = 追加一条 `status: active`（**门禁不看人，只看登记**）；
#   ② 冲突 = **同一个字符串不许同时属于两条**（id 或 alias）；
#   ③ 退役 = 改 `status: retired` 而**不删**（删了就无法解释历史）。
# ═══════════════════════════════════════════════════════════════════════════
version: 1
