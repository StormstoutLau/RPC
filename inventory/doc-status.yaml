# ============================================================================
# 文档状态声明：**两处位点**的登记与存量冻结（O-108 · 2026-09-27）
#
# 为什么需要:
#   `spec` / `adr` 的文档**同时**在 ① front matter 的 `status:` 与 ② 正文的 `> **状态**:`
#   写状态 ⇒ **同一事实两处表达**。实测 **39 文件两处都有**（5 模板 + 34 实例），
#   其中**实例 12 处两处不等**（含 `draft` ↔ `verified` 这类**互斥**）。
#
# ★★ 本表防什么 & **防不了什么**（如实，不藏）:
#   防 = 「**派生过期**」—— 唯一写入点是 front matter，正文行是**渲染**；不等 ⇒ **改正文行**。
#   ★ 严格读 I-10：本面**仍是两个位点**（对账只能检出"两处**不一致**"，检不出"两处**一致地错**"）
#     ⇒ 本表是**降格处置**（唯一写入点 + 派生位点），**不是** I-10 的完全实现。
#     彻底消除的选项**仍开着** = `O-108` 案①（只留 front matter，删 39 处正文行）。
#
# 维护约定:
#   · `freeze` **只装存量**；新增文档**不得**进 freeze（判据会对新不等项直接红）
#   · 冻结项**自愈**（两处已一致）或**不再是两处都有** ⇒ 判据报「把它删掉」（防腐化，
#     同 `inventory/ops.yaml` 的「冻结存量」与 `secrets` 的「豁免未命中」）
#   · 本表**只判两处一致**；**不判**"这个词合不合词表"（词表真值在模板链，见 O-106）
# ============================================================================
version: 1
updated: 2026-09-27

semantics:
  face: 文档状态声明（`spec/**/*.md` + `adr/*.md` 的**文档头**；射程 = 前 20 行）
  single_write: "front matter 的 `status:` —— ★ **唯一可以写入**的地方"
  derived: "正文的 `> **状态**:` —— ★ **只可派生**（渲染），不得独立编辑"
  rule: "不一致时**先确认真值**：若取证显示 **fm 陈旧** ⇒ **先更新 fm（= 真值更新）**，再让正文跟上。★ 「唯一写入点」的意思是「**只有它『可以』写**」，**不是**「它永远对」；**稳态下**（fm 已确认）修法唯一 = **改正文行**，别改 fm 去迁就正文"
  i10_note: "★ 严格读 I-10：本面仍是**两个位点** ⇒ 本表是**降格处置**，非完全实现；彻底消除 = O-108 案①"

