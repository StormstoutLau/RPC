# ============================================================================
# 文档状态声明：**两处位点**的登记与存量冻结 + **档位词表**（O-108 / O-109 · 2026-09-27）
#
# 为什么需要:
#   `spec` / `adr` 的文档**同时**在 ① front matter 的 `status:` 与 ② 正文的 `> **状态**:`
#   写状态 ⇒ **同一事实两处表达**。实测 **39 文件两处都有**（5 模板 + 34 实例），
#   其中**实例 12 处两处不等**（含 `draft` ↔ `verified` 这类**互斥**）。
#
# ★★ 本表防什么 & **防不了什么**（如实，不藏）:
#   防 = 「**派生过期**」—— 唯一写入点是 front matter，正文行是**渲染**；不等 ⇒ **改正文行**。
#   ★ 严格读 I-10：本面**仍是两个位点**（对账只能检出"两处**不一致**"，检不出"两处**一致地错**"）
#     ⇒ 本表是**降格处置**（唯一写入点 + 派生位点），**不是** I-10 的完全实现。
#     彻底消除的选项**仍开着** = `O-108` 案①（只留 front matter，删 39 处正文行）。
#
# 维护约定:
#   · `freeze` **只装存量**；新增文档**不得**进 freeze（判据会对新不等项直接红）
#   · 冻结项**自愈**（两处已一致）或**不再是两处都有** ⇒ 判据报「把它删掉」（防腐化，
#     同 `inventory/ops.yaml` 的「冻结存量」与 `secrets` 的「豁免未命中」）
#   · 本表判**两处一致** + **token 合不合档内词表**（档 → 词表读取位点见 `kind_source`；
#     有模板档的词表真值在**模板链**、无模板档（ledger / process）在**本表** ⇒ 见 O-106 / O-109）
#   ★ **2026-10-03 复核（读数更新）**：门禁 `doc-status` 当日实跑 = **两处都有 39 · 一致 39 · 不等 0**
#     （冻结 0 存量 / **新增 0**）· **词表符合 95/95**（另有模板 10 位点**跳过、不入分母** —— 其「状态」行是词表本身）。
#     ⚠ **射程（如实，别读过头）**：本次 `updated` 的更新来源 = **门禁自动重扫**（它每跑一次都会重扫 39 份
#     文档头的前 20 行）⇒ **不是**人读复核 ⇒ ★ 本表 `semantics` / `unverified` 各条的**结论与置信度一律不变**
#     （尤其"**5 份置信度为中、未经第二方复核**"那条**仍然成立**）。
#     ★ 头部第 7 行那句「实测 39 文件两处都有 … 其中**实例 12 处两处不等**」= **2026-09-27 的历史读数**，
#       已由 2026-09-27 的清账收口（见下方 `freeze: []` 上方那行）⇒ **不构成**与今日"不等 0"的矛盾。
# ============================================================================
version: 1
updated: 2026-10-03

semantics:
  face: 文档状态声明（`spec/**/*.md` + `adr/*.md` 的**文档头**；射程 = 前 20 行）
  single_write: "front matter 的 `status:` —— ★ **唯一可以写入**的地方"
  derived: "正文的 `> **状态**:` —— ★ **只可派生**（渲染），不得独立编辑"
  rule: "不一致时**先确认真值**：若取证显示 **fm 陈旧** ⇒ **先更新 fm（= 真值更新）**，再让正文跟上。★ 「唯一写入点」的意思是「**只有它『可以』写**」，**不是**「它永远对」；**稳态下**（fm 已确认）修法唯一 = **改正文行**，别改 fm 去迁就正文"
  i10_note: "★ 严格读 I-10：本面仍是**两个位点** ⇒ 本表是**降格处置**，非完全实现；彻底消除 = O-108 案①"

# ── 档位 → 词表（**读取位点**分工，O-109 · 2026-09-27）────────────────────
# ★ 有模板的档（design / checklist / adr）**真值在模板链**（`*_TEMPLATE.md` 的「状态」行）；
#   无模板的档（ledger / process）是本仓特有类别、**无模板** ⇒ **真值在此**（`vocab`）。
# ⚠ 判据侧**按 kind 判**（`kind_rule`）；模板文件自身的「状态」行是**词表本身**，**跳过**判定。
kind_source:
  note: "★ 档位 → 词表的**读取位点**分工（**不抄词表**，O-50）：有模板的档（design / checklist / adr）**真值在模板链**；无模板的档（ledger / process）**真值在此**"
  by_kind:
    design:    {from: template, ref: spec/vulkan-version-control/DESIGN_TEMPLATE.md}
    checklist: {from: template, ref: spec/vulkan-version-control/CHECKLIST_TEMPLATE.md}
    adr:       {from: template, ref: spec/vulkan-version-control/ADR_TEMPLATE.md}
    ledger:    {from: here, vocab: [active, frozen, retired]}
    process:   {from: here, vocab: [research, reviewed, finalized]}
  kind_rule: "判档顺序：① `adr/**` → adr；② 文件名含 `CHECKLIST` → checklist；③ 命中下面 `kinds:` 登记 → 按登记；④ 其余 `spec/**/*.md` → design"
kinds:
# ★ 只登记**无模板档**的归属（有模板的按 kind_rule 机械判，不列在此）
