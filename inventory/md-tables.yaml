# md 表格**列数守恒**（A4，2026-09-29）—— 「存量冻结」清单
#
# 判据（唯一实现在 `ops/rpc_check.py` 的 `md_table_scan`）：同一张表里
#   **分隔行 / 数据行** 的**格数** 必须 == **表头** 的格数；格数不符 ⇒ 该行**错位**。
#   事故形态 = 某字段文本里出现**一个未转义的竖线** ⇒ 该行被拆成比表头更多的格，长期无人发现。
#
# 为什么需要本文件：判据上线时**全仓已有 28 处违规 / 13 个文件**（2026-09-29 实测）——
#   若一上线即 FAIL，它就是一台「假红机」（本仓纪律 13 已吃过这个亏）。
#   ⇒ 照 `inventory/ops.yaml` 的「冻结存量」与 `inventory/doc-status.yaml` 的 `freeze` 同法：
#   **冻结存量 · 只减不增** —— 新增违规一律 FAIL；修好某行后**请删掉对应条目**
#   （留着会把本表烂成垃圾桶 —— 同 `secrets` 的「豁免未命中」防腐化）。
#
# 为什么按 `(file, line_sha256)` 而不按行号：行号会随上方插/删行而漂移 ⇒
#   冻结按**行内容指纹**（该**违规原始行**不含换行的 sha256 前 16 位）。
#   行一改（无论修好、还是又改坏成别的形态）指纹即失配 ⇒ 门禁会**自报 `失配`** 并要求清账。
#
# 字段（**逐条显式，不许静默豁免**）：
#   file         : 仓库相对路径（posix）
#   line_sha256  : 该违规原始行的 sha256 前 16 位
#   why          : 冻结理由（**不许省略**）
