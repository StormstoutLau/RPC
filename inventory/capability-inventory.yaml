unverified:
- 本表的 `verdict` 是**判断**，不是测量 —— 判据只保证「**有载体且可达**」，
  **不保证「载体真的管用」**（效力未被任何实验测过）
- 「partial」的 `gap` 与「absent」的 `why` / `evidence` 均为**人工判断**（读数由我手取，**未经第二方复核**）
- 多数「absent」项的「**本仓该不该补**」**未裁**（其中 1 项是 `pending-decision`，需用户定；
  其余 `not-done` 项只是"还没做"，**不等于"应该做"**）
- 本表的**项数选取**（32 项）没有权威清单可比对 ⇒ 「**漏了哪项能力**」**不可判**（只能靠新增时补）
