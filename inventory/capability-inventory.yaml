# ============================================================================
# 能力盘点真值（O-105 · 2026-09-27）
#
# 为什么需要:
#   本仓有 **43 项判据（`rpc check -List`，quick 35 + 全量 8）/ 22 张真值表（`inventory/*.yaml`，含本表）/ 103 行台账**
#   —— 但**没有一张"能力 → 载体 → 判定"的表** ——
#   ⚠ 口径与读数日期：三个数都是 **2026-09-27** 实测，口径如上括号内；★ 它们是**增长型**的，
#     改判据 / 加表 / 加台账行都会动 ⇒ 引用时**带上日期**，别裸引（§86 就栽在这里，见 §89.6）。
#   于是"这项能力到底有没有载体"每次都要**靠问一遍**。实测"能力"字样只出现在
#   4 份调研文档正文里（Ds 工作区扫描 / Agent 生态 / 跨项目调用 / 统一入口）⇒ **散落未成表**。
#   来源 = 姊妹仓 Spec_Workflow 的 P-050 RESEARCH §3.7「差距矩阵」形态（逐项：能力 → 当前载体 → 判定）。
#
# ★★ 本表要防的是什么:
#   不是"能力少"，而是"**能力的存在性靠自报**" —— 所以每项 present/partial **必须给可核载体**，
#   判据会去**仓里真找**（file 存在 / gate 是已注册 CHECKS id / table 在 inventory/）。
#   absent 则**必须写理由**（本仓纪律:「不适用也是一种结论，必须写下来」）。
#
# ★ 与其它真值表的分工:
#   ports.yaml / models.yaml / plugins.yaml … → 各自的**事实**真值
#   本表 → **能力层**：哪些能力有载体、载体是谁、缺什么。**不复制**它们的事实，只**引用**。
#
# 口径 (verdict_scale —— 判据按这个判):
#   present  有可核载体，且本轮读过或跑过
#   partial  有载体，但**已知缺一块** ⇒ 必须写 `gap`（否则 partial 是托词）
#   absent   无载体 ⇒ 必须写 `why` + `why_kind`（★ 且**不豁免** `basis` / `evidence` ——
#            「本仓没有这个机制」**本身也是断言**，要么给读数，要么就是自报）
#
# 维护约定:
#   · 新增/废弃能力 ⇒ 改本表；能力状态变了（absent → present 等）**同一批**改
#   · `updated` 是**读数日期** —— 本表是**增长型载体**，没有日期，读者无法判断它是哪一天的树
# ============================================================================
version: 1
updated: 2026-09-29
self_id: capability-inventory

metric:
  name: capability_items
  unit: 登记项数（增删能力项即变）
  scope: 本文件 `items` 数组；**不含**其它 inventory 表的条目
  note: ★ 增长型计数 ⇒ **必须附口径 + 读数日期**（§87.6 的同日漂移即此类失败）

# ── 封闭集（判据会核「声明 == 判据实现」，防口径漂移）──────────────────────
domains: [verify, identity, orchestration, meta]
verdicts: [present, partial, absent]
basis: [E1, E2]
why_kinds: [na, not-done, pending-decision]
carrier_kinds: [file, gate, table]

source:
  what: 能力清单的**派生来源**（不是新发明 —— 每一项都指向已存在的判据 / 文件 / 真值表）
  from:
  - docs/DEV-LOG-014-decision-refinement.md §85.2（初衷 → 落体 → 判据）
  - docs/DEV-LOG-014-decision-refinement.md §86.3（姊妹仓十道不变式 I-1~I-10）
  - docs/DEV-LOG-014-decision-refinement.md §87.2（两仓能力对照）
  - docs/DEV-LOG-014-decision-refinement.md §88（FTA：残余割集）
  - ops/rpc_check.py 的 CHECKS
  - inventory/ 的既有真值表

