# ============================================================================
# 模型别名单点真值 (inventory)
#
# 为什么要这张表:
#   同一个模型在本集群有**三套写法**并存, 一直靠人记:
#     alias      ── infer-list / conf / cluster.py ROUTE / 文档里用的短名  (本表主键)
#     engine_id  ── 引擎 /v1/models 返回的 id (GGUF repo 全名或量化名)
#     file       ── 磁盘上的 .gguf 文件名
#   例: `gpt-oss-120b` / `lmstudio-community/gpt-oss-120b-GGUF` / `...Q4_K_M.gguf`
#
# 门禁怎么用它 (ops/rpc_check.py 的 inventory 断言 → **对账模式**):
#   校验"声明源"里出现的模型标识都在本表登记 —— 声明源 = ops/cluster.py 的 ROUTE 等常量。
#
#   **刻意不做的**: 扫描全仓库模型名。2026-09-14 实测该方案不可行 ——
#   以 gguf 结尾的强标识有 114 个, **100% 是路径/文件名** (00001-of-00002.gguf、
#   DEST/Qwen3.8-27B-....gguf), 与"模型别名"不是一回事, 纯文本匹配全是噪声。
#
# 数据来源: 2026-09-14 三站实测 (infer-list / /etc/llama-instances/*.env / :8080 /v1/models)
# 字段约定:
#   stations  ── 该别名在哪些站的模型库里 (infer-list)
#   conf      ── 该别名在哪些站有 /etc/llama-instances/<alias>.env
#   stations 与 conf 不一致 = 已知漂移, 记在文件末尾 known_issues
# ============================================================================
version: 1
updated: 2026-09-16

