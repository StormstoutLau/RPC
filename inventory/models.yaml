# ── 非模型 conf (同目录, 但 infer-load 不用它) ──────────────────────
# /etc/llama-instances/ 里并非所有 *.env 都是模型实例。显式登记, 以免被当成漂移。
non_model_conf:
  - alias: nodes
    conf: [B]
    purpose: RPC 节点声明清单
    content: 'RPC_NODES="10.10.10.1:50052 10.10.11.3:50052"'
    owner: /usr/local/bin/rpc-nodes (被其读取)
    note: |
      2026-09-14 查证: 内容是集群 RPC 节点清单 (B5q-1, spec/cluster-bench DESIGN §3),
      由 rpc-nodes 读取, **不是模型实例、也不是误建**。
      (此前在 known_issues 里误判为"疑似误建的伪条目", 已更正 —— 该误判源于只看
      文件名与 infer-list 的差集, 没有打开文件看内容。)

  - alias: ttl
    conf: [A, B, C]
    purpose: 空闲 TTL 自动卸载的开关与阈值
    content: 'TTL_ENABLED=0 / TTL_IDLE_SECONDS=1800 / TTL_DRY_RUN=0'
    owner: /usr/local/bin/cluster-ttl (被其每次运行读取; 由 cluster.py ttl enable|disable 写)
    note: |
      2026-09-15 P2-5 (方案 v2 §A.6): **默认关** —— TTL_ENABLED=0 时检查器只演练、绝不卸载。
      与 nodes.env 同类: 集群级声明文件, 不是模型实例。改它无需重启 (检查器每次运行重读)。
      三站都装 (含 C 站); timer `cluster-ttl.timer` **部署即 disabled**, 显式 enable 才生效。

