# ============================================================================
# 端口单点真值 (inventory)
#
# 为什么需要这张表:
#   `8080 / 32837 / 1234 / 8642 / 8095 / 9095 / 42387` 等端口号曾散落在 100 个文件、
#   475 处, 没有一处是"真值", 于是改一个端口就会忘掉别处。详见
#   docs/research/2026-09-14_暴露问题调研.md 的 CI/CD 与流水线一节。
#
# 门禁怎么用它 (ops/rpc_check.py 的两条断言):
#
#   ① inventory 断言 → **声明源对账** (只对结构化声明源, 见下)
#      校验"声明源"里出现的端口都在本表登记 —— 声明源 =
#        (a) ops/cluster.py 的端口常量 (STATION_PORT 等)
#        (b) docs/三机推理集群使用手册.md 的端点表格行
#      不在本表 => FAIL, 提示登记或修正引用。
#      **刻意不做的**: 扫描全仓库任意 4-5 位数字。2026-09-14 实测该方案不可行 ——
#      51 个"端口"里有 19 个不是端口 (llama.cpp 提交号 9859、参数值 16384/4096/1024、
#      截断匹配 127/808 ...)。文本里的数字没有唯一语义, 扫全仓库必然噪声爆炸。
#
#   ② ports 断言 (P1-4) → **分配表自洽 + 站上占用对账**
#      本地自洽 (quick): 结构四件套齐全 / 同组端口唯一 / 跨组端口不得重叠 /
#                        deprecated 与在用互斥 / scope 与 proto、mode 枚举合法
#      站上对账 (非 quick, 并入 stations 断言): 把三站 `ss -ltnup` 的实测监听
#        端口按站与本表比对 —— 见下方"对账规则"。
#
# 对账规则 (2026-09-15 定档, 首次实测三站后确定):
#   - **无 scope = 三站通用**; 有 scope 则只在列出的站参与对账
#   - **proto 缺省 = tcp+udp 都算**; tcp/http/https 归 TCP 侧, udp 归 UDP 侧,
#     tcp+udp 表示双栈 (mihomo 的 mixed / DNS 端口即是)
#   - **≥ 32768 的未登记端口一律豁免** (ip_local_port_range 下界 = 32768, 三站实测一致)。
#     理由: 该段是内核临时端口, 服务每次启动换号 (NFS 的 mountd/statd 即典型),
#     写死端口号必然过期 —— 见 dynamic 段。
#     ⚠ **< 32768 又会换号**的 (如 rpc.statd 的 loopback 口 724→729→657): 用 unmanaged 的
#     **段位形态** (`owner` + `range` + `bind: 127.0.0.1`) 覆盖 —— 口径见 `O-158` 甲 (2026-10-10)。
#   - 反向 (声明在用却没监听): 有 status 或 mode: on_demand 的条目豁免;
#     其余未监听 => WARN (不阻断, 因为可能只是服务刚好挂了)
#
# 维护约定:
#   - 本表只登记**实测过**的端口 (ss -ltnp + 服务配置核对); 不确定的宁可不登记
#   - 退役端口不要删, 移到 deprecated (保留登记以识别历史引用)
#   - **端口号随启动变化的服务**不要写死: 落点看段位 —— **≥32768** 的登记到 dynamic 段
#     (豁免靠『≥32768 段位规则』); **<32768** 的 (如 rpc.statd 的 loopback 口) 登记为 unmanaged 的
#     **段位形态** (`owner` + `range` + `bind: 127.0.0.1`, 门禁**强制**覆盖口径, 见 `O-158` 甲)
#   - 新增服务 => 改本表
# ============================================================================
version: 1
updated: 2026-10-10
measured_by: "sudo ss -ltnup + 服务配置核对 + 进程归属反查, 三站实测 2026-09-15; 2026-09-30 补登 A 站 8888 (searxng, `O-122`); 2026-10-10 rpc.statd 条改段位形态 (`O-158` 甲) + 三站 `sudo -n ss -lXnp` 取占用者名实测"

# ── 本项目自管的服务端口 ────────────────────────────────────────────
managed:
  - port: 22
    proto: tcp
    purpose: SSH 管理入口
    scope: [master, A, B, C]
    bind: 0.0.0.0
    owner: systemd (ssh.socket)
    note: 三站一致

  - port: 8080
    proto: http
    purpose: 本地推理引擎 API (unsloth studio 对外面)
    scope: [A, B, C]
    bind: 127.0.0.1
    expect_bind: 127.0.0.1
    owner: unsloth studio (后端 llama-server)
    mode: on_demand
    consumers: [opencode, claude code, hermes, ops/cluster.py, ops/rpc_check.py]
    note: |
      引擎**忽略**请求里的 model 字段, 服务的永远是"当前加载的那个模型"
      (2026-09-14 实测: 传 __bogus__ 仍返回 200)。故 agent provider 的模型键取常量 main。
      mode: on_demand —— 三站均按需启停 (零自加载方针), 未监听属正常, 不算故障。
      ⚠ 2026-10-05 实测补记（**登记口径 · 不是判据**）: 占着 8080 的**引擎形态不必是 studio** ——
      A 站曾以 `llama-single`（`/opt/llama.cpp` 的 Vulkan 二进制）服务（**外部消费者 Auto_Prover 的
      运行前置**所要求，见 O-146）; 也曾服务 **MiniMax-M2.7** 而非常记的 gpt-oss-120b ⇒
      **"哪条路径 / 哪个模型"由当班消费者决定**。门禁只判"占用者形态**认不认得出**"
      （`other` / `unknown` ⇒ WARN，见 O-146 乙′），**刻意不判"哪一站该跑哪个"**。

  - port: 32837
    proto: http
    purpose: unsloth studio 内部第二 llama-server (--parallel 4)
    scope: [B]
    bind: 127.0.0.1
    owner: llama-server
    mode: on_demand
    note: 与 8080 跑同一模型; B 站的 provider 条目已删除, 此端口保留为 studio 内部路径

  - port: 8095
    proto: http
    purpose: cluster.py web 面板 (按需启停, 非常驻)
    scope: [master]
    bind: 127.0.0.1
    owner: ops/cluster.py web
    mode: on_demand

  - port: 50052
    proto: tcp
    purpose: llama.cpp rpc-server (仅 RPC 模式运行时)
    scope: [A]
    bind: 10.10.10.1
    owner: rpc-server
    mode: on_demand
    note: |
      对应 cluster.py 的 llama-rpc backend (BACKENDS 里的 "llama-rpc")。
      手册端点表登记为 "A 站 10.10.10.1:50052"; 10.10.10.1 是 USB4 直连网, 非管理网。
      仅 RPC 分布式加载时由 rpc-server@.service 拉起, 平时不监听。

  - port: 9911
    proto: tcp
    purpose: ds4 (DwarfStar) 双机 PP coordinator↔worker 通道
    scope: [B, C]
    bind: 10.10.11.1
    owner: ds4 (--role coordinator)
    mode: on_demand
    note: |
      仅双机 PP 运行时由 coordinator 监听 (ds4 --role coordinator --listen ... 9911); 平时不监听。
      B↔C 走 USB4 直连 10.10.11.x (B=10.10.11.1 / C=10.10.11.3), **非管理网**;
      worker 以 --coordinator 10.10.11.1 9911 连入。
      承 ADR-0010 (v1.1) / spec/ds4-backend/DESIGN.md: ds4 在 ROCm **TP 被源码门禁拒绝**、
      **PP 实测前向 SIGSEGV** ⇒ **双机形态整体冻结**（上游 antirez/ds4#1141）；本条目**保留登记**
      （on_demand，冻结期间不监听），解冻条件见 ADR-0010 §失效条件。

  - port: 8642
    proto: http
    purpose: hermes api_server
    scope: [A]
    bind: 127.0.0.1
    owner: hermes (platforms.api_server)
    status: configured_but_stopped
    note: 配置已启用, 但 2026-09-14 实测无监听

  - port: 8888
    proto: http
    purpose: 自建 SearXNG 元搜索引擎 (Agent 检索基础设施)
    scope: [A]
    bind: 127.0.0.1
    owner: "docker (compose: ~/searxng, 容器未起)"
    mode: on_demand
    status: configured_but_stopped
    note: |
      2026-09-30 登记 (`O-122`)：宿主端口由 `8080` **改让**为 `8888`（承「8080 双重声明谁让位」裁定）。
      原 compose 写死 `8080:8080`，与 A 站推理引擎 (unsloth studio, 本表 managed/8080) 撞声明；
      实测 2026-09-30：8080 空闲、无 searxng 容器 ⇒ 当时无冲突，但 `compose up` 即撞。
      ⇒ 改 `"8888:8080"` + `SEARXNG_BASE_URL` 同步；选 8888 因它是该 skill 文档**自带的示例端口**
      （`SEARXNG_URL=http://localhost:8888`）⇒ compose 与文档一致。
      ⚠ `SEARXNG_URL` 站上**未设置**（无 shell profile / environment.d 绑定）⇒ 本项**同步的是文档口径**，非改绑定。
      证据：`docker compose config` 实测 `published: "8888"`；备份件 `docker-compose.yml.bak_20260930`。
      mode/status 双标 ⇒ **未监听不算故障**（豁免本表"声明在用却没监听"的反向对账）。

# ── 非我方开发, 但我方依赖 (实测登记) ───────────────────────────────
