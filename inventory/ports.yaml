# ── 系统/硬件服务 (非我方负责, 登记仅为让对账能解释它们) ─────────────
# 无 scope = 三站通用; 有 scope = 只在该子集参与对账
unmanaged:
  - {port: 53, purpose: systemd-resolved 本地 DNS, note: "127.0.0.54 / 127.0.0.53"}
  - {port: 111, purpose: rpcbind (NFS 依赖), scope: [B]}
  - {port: 139, purpose: Samba (SMB), scope: [A, B]}
  - {port: 445, purpose: Samba (SMB), scope: [A, B]}
  - {port: 631, purpose: CUPS 打印服务}
  - {port: 2049, purpose: "NFS server (B 站对外提供)", scope: [B]}
  - {port: 9000, purpose: "lemond (硬件守护, 非 HTTP)", scope: [A, B], bind: 127.0.0.1}
  - {port: 13305, purpose: "lemond (硬件守护)", scope: [A, B], bind: 127.0.0.1}
  # ── 2026-09-15 P1-4 对账补登 ──────────────────────────────────────
  # 下面这批是首次做"站上监听端口 vs 本表"对账时暴露的漏登记。
  # 判据: 端口 < 32768 (非内核临时段) 且实测有监听。
  - {port: 137, proto: udp, purpose: "nmbd (NetBIOS 名称服务, Samba)", scope: [A, B]}
  - {port: 138, proto: udp, purpose: "nmbd (NetBIOS 数据报, Samba)", scope: [A, B]}
  - {port: 546, proto: udp, purpose: "NetworkManager DHCPv6 客户端",
   note: "按接口绑定 (fe80::%if), 非全局监听"}
  - {port: 5353, proto: udp, purpose: "avahi-daemon (mDNS / DNS-SD)"}
  - {port: 3702, proto: udp, purpose: "wsdd (WS-Discovery)", scope: [A],
   note: "由 gvfsd 会话拉起 (user-1000), 未登录时不存在; 故仅会话期监听"}
  - {port: 6665, proto: udp, purpose: "netconsole-listen (A 站 printk 镜像接收)", scope: [B],
   note: "netconsole 默认端口; B 站 netconsole-listen.service → /usr/local/bin/netconsole-listen.py"}
  # ── 段位形态 (O-158【甲】· 2026-10-10 裁定并落): 端口号不是真值, owner + 段位才是 ──
  # 覆盖口径 (`ops/rpc_check.py` 的 `_reg_covers` ②): **三闸齐**才覆盖 —— 端口落在 range 内 ·
  # 站上实况**绑在 loopback** · 占用者名**命中 owner**。⚠ 占用者名取不到 (sudo -n 失败等) ⇒
  # **不覆盖** (判不了 ≠ 通过)。站上取数 = `STATION_CMD` 的 `[towner]/[uowner]` (sudo -n ss -lXnp;
  # 2026-10-10 三站实测可用)。表内自洽校验 = `check_ports` 的 (3b)。
  - owner: rpc.statd
    proto: udp
    purpose: "rpc.statd 的**本地特权套接字** (NFS NSM / 状态监控)"
    scope: [B]
    bind: 127.0.0.1
    range: [512, 1023]
    note: "★★ 2026-10-10 按 `O-158`【甲】裁定: 原为整数形态（`724` 原登记 → `729` 09-29 实测 → `657` 10-10 实测 —— **三次实测三次不同**，都落在特权段 512–1023 ⇒ rpc.statd 每次启动**自选**）⇒ 改为 **owner/段位形态**：一次覆盖、**不再随重启失效**。判据 = `ops/rpc_check.py` 的 `_reg_covers` ② + 夹具 `tests/test_rpc_check_ports_range.py`（含同源对照：旧整数形态对轮换后的口必红）。⚠ **不得**把本条读成「rpc.statd 固定用某口」—— 它没有固定口。⚠ 它**不是** rpcbind 注册的那个 status 服务：`rpcinfo -p` 显示 100024 注册在**动态**端口（实测 udp `43981` / tcp `33391` 等，**均 ≥32768** ⇒ 由『≥32768 段位规则』豁免），本条只登记这个**落在豁免线以下**的 loopback 口"

# ── 动态端口服务 (端口随启动变化 → 按 owner + 段位豁免, 不写死端口号) ──
# 为什么单开一段: 2026-09-14 曾把 mountd/statd 的**当次**端口
# (52591 / 53517 / 55723) 登记进 unmanaged; 2026-09-15 复核发现已全部变化
# (本轮 mountd → 33179/43589/...)。**端口号不是真值, owner + 段位才是**。
# 故这几条从 unmanaged 移出, 对应的对账豁免由"≥ 32768 段位规则"承担。
dynamic:
  - owner: rpc.mountd
    purpose: NFS 挂载守护 (端口由 rpcbind 动态分配)
    scope: [B]
    proto: tcp+udp
    note: "2026-09-15 实测 TCP 33179/43589/49945/54599/59535/59537, UDP 41770/41807/43053/43854/51920/60381"
  - owner: rpc.statd
    purpose: NFS 状态监控 (NSM)
    scope: [B]
    proto: tcp+udp
    note: "2026-09-15 实测 TCP 33925/49957, UDP 36339/58847; 落在 <32768 的那个 loopback 口 (724→729→657, 每次启动自选) 由 unmanaged 的 rpc.statd **段位条目**解释 (O-158 甲, 2026-10-10)"
  - owner: nfsd (内核线程)
    purpose: NFS 服务端内核套接字
    scope: [B]
    proto: tcp+udp
    note: "ss 无 users 字段 (内核线程, 非用户态进程); 2026-09-15 实测 TCP 33709/36193, UDP 36102/39086"
