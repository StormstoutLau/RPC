    scope: [B]
    bind: "*"
    owner: beszel-hub.service
    note: |
      2026-09-15 修正: 此前登记为 "Beszel agent, scope [A, B]" —— **错**。
      实测 A 站只有 beszel-agent.service (active, 但它是**出站**连 hub 的客户端, 不监听);
      :8090 的监听方是 B 站的 beszel-hub.service。故 scope 收敛为 [B], owner 改为 hub。

  - port: 9090
