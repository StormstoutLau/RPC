# ops/ 脚本治理登记表 (ADR-0004: 统一管理入口为唯一管理面)
#
# 为什么有这张表: ops/ 下积累了 ~250 个一次性脚本 (_xxx.sh 一堆), 它们各自管一小块,
# 与统一入口能力重复、还各自要维护 —— 本表把存量**冻结**(只减不增), 并让门禁能拦住新增。
# 断言 `scripts` 会检查: ops/ 下任何脚本必须 ∈ 三张清单之一, 否则 FAIL。
#
# 新增脚本的正确姿势 (按优先级):
#   ① 给统一入口加子命令 (ops/cluster.py <sub>) —— 默认选择
#   ② 属站上运行时件 (被入口/systemd 调用) ⇒ 加进 station_runtime
#   ③ 确需独立一次性脚本 ⇒ 加进 frozen_ops_scripts 并在提交信息里说明为何不能并入入口
# (临时验证脚本请放 tmp/ —— 它不在 git 跟踪范围内, 本断言也不会看到它)

# 统一管理入口本体: 所有管理操作从这里走
entry:
  - ops/cluster.py
  - ops/cluster_web.py
  - ops/rpc_check.py
  - ops/rpc.ps1

# 入口的**拆分模块** (2026-09-23 新增类目): 被上面某个入口 import 的实现模块,
# 不是并列入口、也不是独立脚本 —— 三者的区别在"谁能直接被当命令跑":
#   entry                = 可直接执行的管理入口
#   entry_modules        = 只被入口 import 的实现模块 (不可直接跑)
#   station_runtime      = 入口/systemd 调起的站上件
# 为什么单列而不塞进 entry: entry 的语义是"入口", 塞模块会让"入口 4"这种计数失去意义。
# 拆分方案见 docs/2026-09-23_cluster.py模块化重构_调研与方案.md (阶段 1 逐批抽取)。
entry_modules:
  - ops/cluster_const.py
  - ops/cluster_console.py
  - ops/cluster_ssh.py
  - ops/cluster_model.py
  - ops/cluster_secrets.py
  - ops/cluster_egress.py

# cluster 模块**层序**（D6-P2-1，底→顶）：**只允许依赖严格下层**（同层/反向/成环 ⇒ 门禁 `deps` FAIL）。
# 为什么单列: 拆出 5 个模块后, "谁能 import 谁"原先**无任何约束** ⇒ 反向依赖会悄悄长回来。
# **新模块必须在此登记层次**（未登记 ⇒ FAIL）—— 登记这个动作就是"声明它站在哪一层"。
# 判据: `ops/rpc_check.py` 的 `check_cluster_deps`（**AST** 解析, 严格区分模块级 / 函数内懒加载）。
cluster_layers:
  - [ops/cluster_const.py, ops/cluster_console.py]    # L0 最底: 无内部依赖(纯声明 / 纯工具)
  - [ops/cluster_ssh.py]                              # L1: → const
  - [ops/cluster_model.py, ops/cluster_secrets.py]    # L2 平面类(互不依赖): → ssh/const
  - [ops/cluster_egress.py]                           # L3: → secrets/ssh/const
  - [ops/cluster.py]                                  # L4 入口: 聚合全部下层
  - [ops/cluster_web.py]                              # L5 顶层 WEB 入口: 复用 cluster

# 已登记的**反向懒加载**（[上游, 下游, 原因]）：懒加载 import **不构成导入环**（它是刻意打破环的手段），
# 但**反向**（越层）懒加载仍是设计越界 ⇒ 必须登记。⚠ 未命中会自报"已可移除"（同 P0-2 防腐化纪律）。
cluster_lazy_allow:
  - [ops/cluster.py, ops/cluster_web.py,
     "`web` 子命令的入口派发: cluster 在函数内懒加载 cluster_web(避导入环), 而 cluster_web 模块级复用 cluster 的 ssh_run/probe_frames/cmd_load 等 ⇒ 顶层双向; 拆环收益 < 成本"]

# 站上运行时件: 入口/systemd 调用的被调方 (不是并列入口)
