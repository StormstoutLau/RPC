# ops/ 脚本治理登记表 (ADR-0004: 统一管理入口为唯一管理面)
#
# 为什么有这张表: ops/ 下积累了 ~250 个一次性脚本 (_xxx.sh 一堆), 它们各自管一小块,
# 与统一入口能力重复、还各自要维护 —— 本表把存量**冻结**(只减不增), 并让门禁能拦住新增。
# 断言 `scripts` 会检查: ops/ 下任何脚本必须 ∈ 三张清单之一, 否则 FAIL。
#
# 新增脚本的正确姿势 (按优先级):
#   ① 给统一入口加子命令 (ops/cluster.py <sub>) —— 默认选择
#   ② 属站上运行时件 (被入口/systemd 调用) ⇒ 加进 station_runtime
#   ③ 确需独立一次性脚本 ⇒ 加进 frozen_ops_scripts 并在提交信息里说明为何不能并入入口
# (临时验证脚本请放 tmp/ —— 它不在 git 跟踪范围内, 本断言也不会看到它)

# 统一管理入口本体: 所有管理操作从这里走
entry:
  - ops/cluster.py
  - ops/cluster_web.py
  - ops/rpc_check.py
  - ops/rpc.ps1

# 入口的**拆分模块** (2026-09-23 新增类目): 被上面某个入口 import 的实现模块,
# 不是并列入口、也不是独立脚本 —— 三者的区别在"谁能直接被当命令跑":
#   entry                = 可直接执行的管理入口
#   entry_modules        = 只被入口 import 的实现模块 (不可直接跑)
#   station_runtime      = 入口/systemd 调起的站上件
# 为什么单列而不塞进 entry: entry 的语义是"入口", 塞模块会让"入口 4"这种计数失去意义。
# 拆分方案见 docs/2026-09-23_cluster.py模块化重构_调研与方案.md (阶段 1 逐批抽取)。
entry_modules:
  - ops/cluster_const.py
  - ops/cluster_console.py
  - ops/cluster_ssh.py
  - ops/cluster_model.py
  - ops/cluster_secrets.py
  - ops/cluster_egress.py
  - ops/conf_parse.py          # P1 #4: conf 解析（被 cluster.py 函数内懒加载；纯模块，不可直接跑）

# cluster 模块**层序**（D6-P2-1，底→顶）：**只允许依赖严格下层**（同层/反向/成环 ⇒ 门禁 `deps` FAIL）。
# 为什么单列: 拆出 5 个模块后, "谁能 import 谁"原先**无任何约束** ⇒ 反向依赖会悄悄长回来。
# **新模块必须在此登记层次**（未登记 ⇒ FAIL）—— 登记这个动作就是"声明它站在哪一层"。
# 判据: `ops/rpc_check.py` 的 `check_cluster_deps`（**AST** 解析, 严格区分模块级 / 函数内懒加载）。
cluster_layers:
  - [ops/cluster_const.py, ops/cluster_console.py]    # L0 最底: 无内部依赖(纯声明 / 纯工具)
  - [ops/cluster_ssh.py]                              # L1: → const
  - [ops/cluster_model.py, ops/cluster_secrets.py]    # L2 平面类(互不依赖): → ssh/const
  - [ops/cluster_egress.py]                           # L3: → secrets/ssh/const
  - [ops/cluster.py]                                  # L4 入口: 聚合全部下层
  - [ops/cluster_web.py]                              # L5 顶层 WEB 入口: 复用 cluster

# 已登记的**反向懒加载**（[上游, 下游, 原因]）：懒加载 import **不构成导入环**（它是刻意打破环的手段），
# 但**反向**（越层）懒加载仍是设计越界 ⇒ 必须登记。⚠ 未命中会自报"已可移除"（同 P0-2 防腐化纪律）。
cluster_lazy_allow:
  - [ops/cluster.py, ops/cluster_web.py,
     "`web` 子命令的入口派发: cluster 在函数内懒加载 cluster_web(避导入环), 而 cluster_web 模块级复用 cluster 的 ssh_run/probe_frames/cmd_load 等 ⇒ 顶层双向; 拆环收益 < 成本"]

# 站上运行时件: 入口/systemd 调用的被调方 (不是并列入口)
station_runtime:
  - ops/rpc-nodes
  - ops/station-bin/infer-load
  - ops/station-bin/infer-unload
  - ops/station-bin/infer-list
  # P1 #3/#4 (2026-10-27): 站上共享库 + conf 读取薄壳 —— 被 infer-load/infer-list source、rpc_check 经 ssh 调用。
  - ops/station-bin/model-locate.sh
  - ops/station-bin/conf-lib.sh
  - ops/station-bin/conf-get
  - ops/station-bin/llama-serve-instance
  - ops/station-bin/rpc-serve-instance
  - ops/station-bin/load-gate
  - ops/station-bin/load-mem-gate
  - ops/station-bin/wait-gtt-release
  - ops/station-bin/cluster-watchdog
  - ops/station-bin/cluster-ttl
  - ops/station-bin/reqlog
  - ops/station-bin/plugin-probe
  - ops/station-bin/gguf-meta
  - ops/station-bin/_oc_session_meta.sh
  - ops/station-bin/_slot_gate.sh
  - ops/station-bin/_station_ready.sh
  - ops/station-bin/agent-cli.ps1
  - ops/station-bin/backup-memories.sh
  - ops/station-bin/ocrun
  - ops/lm-download/lm_manifest.py
  - ops/lm-download/lm_recon.py
  - ops/lm-download/lm_jobs_inspect.py
  - ops/lm-download/lm_jobs_clean.py

# 站上 shell **严格模式**（review-p2-big #5，2026-10-28）：真值 = 本段；判据 = `rpc_check` 的 `shell-strict`。
#   exec = 可直接执行/被 systemd 调起的件 ⇒ 必须 `set -euo pipefail`（**逐字**，前 20 行首条非注释行）。
#   libs = 被 `source` 的共享库 ⇒ **不得**出现任何 `set +-...`（库改调用方选项 = 跨层副作用）。
#   allow = 执行件的显式豁免；每条必须写 why；⚠ 文件若已变严格 ⇒ 该条**必须删除**（门禁报"豁免未命中"）。
shell_strict:
  exec:
    - ops/rpc-nodes
    - ops/station-bin/infer-load
    - ops/station-bin/infer-unload
    - ops/station-bin/infer-list
    - ops/station-bin/llama-serve-instance
    - ops/station-bin/rpc-serve-instance
    - ops/station-bin/load-mem-gate
    - ops/station-bin/wait-gtt-release
    - ops/station-bin/conf-get
    - ops/station-bin/cluster-watchdog
    - ops/station-bin/ocrun
    - ops/station-bin/backup-memories.sh
  libs:
    - ops/station-bin/model-locate.sh
    - ops/station-bin/conf-lib.sh
  allow:
    - file: ops/station-bin/load-gate
      why: "报告型门禁：四条规则必须全部跑完再给 [ABORT]/[WARN]/[OK]，abort 会丢结论；取数函数在逻辑或列表中被调用 ⇒ -e 本就不生效（SC2310），保留 set +e 是显式化，不是疏漏"

# `station-bin` 布局（review-p2-big #8A）：根目录只放 部署件 / 入口运行时件 / 在跑夹具。
#   一次性 `_*` 探针 → `probes_dir`；根目录 `_*` 只允许 `root_keep`（9 项，逐条有角色）。
#   ⚠ 迁移纪律：`git mv` 不改内容；登记 `frozen_ops_scripts` 同步删除（只减不增）。
station_bin_layout:
  probes_dir: archive/station-bin-probes
  root_keep:
    # 运行时件：agent-cli 上传到站上执行（station_runtime）
    - _station_ready.sh
    - _slot_gate.sh
    - _oc_session_meta.sh
    # 在跑夹具：CHECKS 直接执行（ps1-golden / ps1-runstamp / scrubber 覆盖）
    - _fm_golden_test.ps1
    - _probe_fallback.ps1
    - _runstamp_hammer.ps1
    - _scrubber_coverage_test.ps1
    # 被黄金夹具 AST 读取的对象
    - _switch_qwen_flavor.ps1
    - _switch_qwen_flavor.sh

# 历史一次性脚本: **只减不增**; 迁进统一入口后请从本表删除 (删减是受欢迎的方向)
frozen_ops_scripts:
  # 2026-09-26 (O-85): ID 站点普查 —— 口径的**唯一实现**。**为何不能并入入口**（ADR-0004 要求写明理由）:
  #   ① 门禁 `id-census` 与"重出真值"**必须用同一份代码** —— 口径分两份写就是本仓头号形态
  #      （"同一事实两个定义点"）;
  #   ② 它有一个**写入动作**（`--emit` 重写真值），而 `rpc_check.py` 是**门禁**: 门禁应当**只读**,
  #      把写盘能力挂到门禁上是职责相反;
  #   ③ 它被门禁以 `importlib` 全路径加载（不靠 sys.path）⇒ 与 `_fm_golden_test.ps1` /
  #      `_runstamp_hammer.ps1` 同类: **受治理的夹具**, 而非并列管理入口。
  - ops/id_site_census.py
  # 2026-09-26 (U-4): ID **存储面**普查（`affected` 的生产者）。与 `id_site_census.py` **同一条理由**：
  #   ① 门禁 `id-storage` 与"重出真值"必须**同一份代码**（口径分两份写就是"同一事实两个定义点"）;
  #   ② 它也有**写入动作**（`--emit`）与 `--invalidate` 的**决策输出** ⇒ 挂在只读门禁上职责相反;
  #   ③ 被门禁以 `importlib` 全路径加载 ⇒ 同属**受治理的夹具**。
  #   ⚠ 它**只读**打开别的项目的生产库（`mode=ro` / `read_only=True`）—— 这一点写进了脚本 docstring。
  - ops/id_storage_census.py
  # 2026-09-26 (D7-P2-3): **审判据自身** —— 恒真检测（变异法）+ 覆盖率对账。三条理由：
  #   ① 它**只读**（不写盘、不改真值）;
  #   ② **刻意不是**门禁项：实测"变异**包装**（`check_*`）"会产出 **41/43 噪声**（本仓测试测的是
  #      **本体纯函数**，包装是薄壳）⇒ **先量后定档**（本仓既定纪律）⇒ 不进 `CHECKS`、不挂 quick;
  #   ③ 它**跑子进程**（每条判据 2 次）⇒ 会明显拉长门禁时间 ⇒ 亦不适合挂 quick。
  #   ⚠ 它是**工具**而非入口：用法见其 docstring（`--list` / `--sample N` / `--all` / `--id X`）。
  - ops/judge_selfcheck.py
  # 2026-09-26 (D7-P3-1): **producer↔judge 配对审计** —— J-1/J-2 的**最小消费者**。
  #   ① **只读**且**不判灯**（本仓纪律"先量后定档"，同 O-69/O-97）;
  #   ② 它存在的理由：两条判据的被判对象在**站上 runDir**（`run.json` + `review.json`）
  #      ⇒ 本仓门禁读不到 ⇒ 不加这个消费者，它们就一直是"判据库、没人用";
  #   ③ 不挂门禁的另一条：它要遍历**可达项目**（跨机器、几百个 runDir）⇒ 属审计级而非 committing 级。
  - ops/agent_pair_audit.py
  # 2026-09-29 (A3): **派生只读视图**的渲染器 + 校验器（真值 → 渲染 → 逐字节比对）。
  #   与 id_site_census.py **同一条理由**（ADR-0004 要求写明为何不能并入入口）:
  #   ① 门禁 `derived-view` 与"重渲染真值"必须用**同一份代码** —— 渲染口径分两份写就是本仓头号形态
  #      （"同一事实两个定义点"）;
  #   ② 它有**写入动作**（`--emit` 重渲染并落档视图），而 `rpc_check.py` 是**门禁**（应当只读）⇒
  #      把写盘能力挂到门禁上是职责相反;
  #   ③ 它被门禁以**子进程**调用（`py ops/derived_view.py --check`，三态退出码 0/1/2）⇒ 与
  #      `_fm_golden_test.ps1` 同类: **受治理的夹具**，而非并列管理入口。
  - ops/derived_view.py
  - ops/lm-download/speedtest_asset.sh
  - ops/lm-download/speedtest_codeload.sh
  - ops/lm-download/speedtest_mirrors.sh
  - ops/station-bin/_fm_golden_test.ps1
  # 2026-09-22: 原在**仓库根** `_o26_reverify_loader.ps1`（O-11 L2 薄加载器工装）—— 根级脚本不在
  #   `scripts` 门禁治理圈 ⇒ 与卡片/附件**互为引用的活体**却无人看管。按决策简报分类处置：整组迁入
  #   受治理位置（卡片→spec/d6-agent-standard/test-cards/、附件→ops/station-bin/attach-test/），
  #   并把硬编码绝对路径改为由脚本位置推算仓库根。
  - ops/station-bin/_probe_fallback.ps1
  # 2026-09-25 (O-63): ts **取号**的跨进程并发夹具。**为何不能并入入口** (ADR-0004 要求写明理由):
  #   它判的正是"**独立进程**同时抢占同一 ts" —— 必须 `Start-Process` 起 N 个**真进程** + 共同释放时刻
  #   屏障, 才能复现 OS 级竞态; 同一 Python 进程内的子命令**物理上不可能**制造出这个竞态 ⇒ 归 ③ 类。
  #   它被门禁 `ps1-runstamp` (quick=False) 以 `-File` 方式调起, 属受治理的**门禁夹具**, 与 `_fm_golden_test.ps1` 同类。
  - ops/station-bin/_runstamp_hammer.ps1
  - ops/station-bin/_scrubber_coverage_test.ps1
  - ops/station-bin/_switch_qwen_flavor.ps1
  - ops/station-bin/_switch_qwen_flavor.sh
  - ops/station-bin/a5-nextday-verify.sh
  - ops/station-bin/agent-cli-smoke.sh
  - ops/station-bin/ars-migrate-verify.sh
  - ops/station-bin/b6_smoke_qwen38_27b.py
  - ops/station-bin/b6_smoke_qwen38_27b_fullctx_mxthink.py
  - ops/station-bin/golden/cpphub_beta_golden.sh
  - ops/station-bin/golden/cpphub_golden.py
  - ops/station-bin/golden/o13_sympy_golden.py
  # 2026-09-18: ADR-0007 阶段 0.5 改动验证夹具的 golden（配套卡 spec/d6-agent-standard/
  #   test-cards/smoke-dispatch.md）。刻意**入库**而非放 tmp/ —— ADR-0005 的等价夹具卡因
  #   tmp/ 被 .gitignore 而丢失。它不管理任何资源，故入 frozen（与既有 golden 同桶）。
  - ops/station-bin/golden/smoke_dispatch_golden.sh
  - ops/station-bin/repro-check.sh
