# 结论收束账本真值表（D7-P3-2 · 「结论收束记账」）
#
# ── 这是什么 ────────────────────────────────────────────────────────────────
# 合并稿 §13.3 原话：「D7 的结论留痕应**复用 `inbox` 的 `40_state/LOG.md` 追加式纪律**，
#   **不新造账本**。」本表就是那句话的**可判形态**：把「本仓有哪些账本」写成**封闭集**，
#   于是「**有人新造了第二本账本**」从「靠人记得」变成**可机判**（门禁 `conclusion-ledger`）。
#
# ── 为什么必须做成封闭集（本仓头号失败形态）────────────────────────────────
# 本仓反复吃亏的形态是「**同一件事被写在两处**」。账本尤其危险：
#   · 两本账本 ⇒ 两套追加纪律 ⇒ 迟早**只有一本被读**，另一本静默腐化；
#   · 而「账本」**没有天然的机器可辨边界**（`.md` / `.json` / `.jsonl` 都可能是）
#     ⇒ 故此处**显式定义口径**，而不是靠文件名猜（口径不先定就量 = 本仓已吃过三次亏）。
#
# ── 口径（写死在此，不许再含糊）────────────────────────────────────────────
# **账本** = 同时满足三条的**追加式记录簿**：
#   ① 只**追加**，不就地改写既有条目（`discipline: append-only`）；
#   ② 有**唯一写入者**（人，或一个确定的命令）—— 写入者必须写在本表；
#   ③ 有**独立校验**（本仓已有门禁或 verify 命令能判它有没有被动过）。
# ⚠ 因此 **`review.json` 不是账本**（一次派发一份、不可追加）· **`OPEN-ISSUES.md` 不是账本**
#   （台账：状态格**就地改写**）。两者都在 `not_a_ledger` 段**显式点名** ——
#   因为「看着像账本」正是最容易把它误当第二本账本的理由。

version: 1
updated: 2026-09-26
owner: Scott (鹏)
basis: "D7-P3-2 · 合并稿 §13.3 · 路线总表 §4.3（退出判据：不新造账本）"

# 纪律：本表当前只认一种。若将来要加第二种，**必须**先在这里显式扩枚举并写明理由 ——
# 不许在别的文件里悄悄引入（那正是本表要防的事）。
disciplines: [append-only]

ledgers:
  - id: inbox-state-log
    what: 受理区**状态变更**记录（何时、改成什么状态、为什么、谁改的）
    globs: ["inbox/*/40_state/LOG.md"]
    writer: 管理员（人）；`inbox/_template/` 那一份是模板，由新项目复制而来
    discipline: append-only
    truth_doc: "inbox/README.md §3（每次变更在 `40_state/LOG.md` 追加一条）"
    verify: "门禁 `inbox`（状态自洽）+ 本表的『未登记账本』扫描"

  - id: agent-evidence-chain
    what: agent 派发的**证据链**（逐条记 run 与件哈希；`prev` 链接的是**入链顺序** = append-only 日志序）
    paths:
      - ops/station-bin/agent-chain.json          # 工作本（派发时追加后重写）
      - archive/evidence-chain/agent-chain.json    # 冷镜像
      - archive/evidence-chain/ANCHOR.txt          # 外部锚（ADR-0007：an anchor is REQUIRED）
    writer: "ops/cluster.py agent chain（钩子自动入链）"
    discipline: append-only
    truth_doc: "spec/d6-agent-standard/evidence-chain/DESIGN.md"
    verify: "`cluster.py agent verify` / 门禁 `evidence`（digest / chain_break / cold_mismatch / anchor_mismatch）"

# ── ★★ 「不新造账本」的**正面表述**：哪些东西**看着像账本但它不是** ──────────
# 这一段**不是注释** —— 门禁要求它**非空**：因为「什么不算账本」必须写下来，
# 否则下一个人会按「看着像」去建第二本。
not_a_ledger:
  - glob: "**/review.json"
    why: >-
      一次派发一份的**产物**（不追加、下次覆盖）⇒ 判据①不成立 ——
      它是账本里**被记账的对象**，不是账本。D7 的结论（`verdict` / `findings` / 收束分类）
      落在它这里，并经 `Get-FrameworkSubjects` **入证据链** ⇒ **结论已在既有账本里**
      （这正是合并稿要求的「复用」的**实测形态**，不是承诺）。
  - glob: "spec/d6-agent-standard/OPEN-ISSUES.md"
    why: >-
      **台账**：状态格会被**就地改写**（本轮实测：「仍开着」从 19 降到 2 就是改出来的）
      ⇒ 判据①不成立。判定它的是门禁 `ledger-status`（又是另一个口径），**不是**本项。
  - glob: "docs/DEV-LOG-014-decision-refinement.md"
    why: >-
      **开发日志**：按 §序号**追加**（②③勉强成立），但它**不是机器可读记录簿**、
      也没有独立校验（只能人读）⇒ 不进 `ledgers`。⚠ 它的「追加」是**纪律**，不是机制保证。

# ── 扫描口径（门禁据此判「有没有未登记的账本」）────────────────────────────
# 用 fnmatch 语义（`*` 跨 `/`）—— 这是**显式选择**：本表要的是「**形状覆盖**」而非「精确路径」，
# 因为它防的是「新造一本长得像的」，不是「路径打错字」（后者 `doclinks` 管）。
scan:
  globs: ["inbox/*/40_state/LOG.md"]
  exclude_dirs: [".git", "node_modules", ".venv", "tmp"]

# ── 如实登记：本项**自己**未实测 / 未定的部分 ──────────────────────────────
unverified:
  - item: "扫描口径只覆盖 `inbox/*/40_state/LOG.md`"
    why: >-
      **这是本项最大的逃逸面**：若有人新造一本**别的名字**的账本（如 `LEDGER.jsonl`），
      本项**看不到它**。之所以没做成「扫所有像账本的文件」，是因为那个口径**不可判** ——
      实测 `LOG|LEDGER|CHAIN|JOURNAL` 之类的名字命中大量文档，**全是假阳性**
      ⇒ 现口径是**精确但窄**的。逃逸**如实记在此**，不假装已覆盖。
  - item: "『结论收束』只验到『进了链』，**未验**『结论内容对不对』"
    why: >-
      链只保证**完整性与顺序**（内容寻址 + prev + 外部锚），不保证结论正确 ——
      同 `evidence-chain/DESIGN.md` §3 的「不是密码学不可否认」。
  - item: "账本数量会不会应当 > 2"
    why: >-
      本表只登记**实测存在**的两本。合并稿说本机群「已具备这套形态的三分之二」，
      指的是**内容寻址 / append-only / 状态可机读**三件（不是三本账本）——
      本轮**未逐一核对九项目**（那在别的仓）⇒ 本表的封闭集**只对本仓成立**。
