  - path: docs/2026-09-23_Spec_Workflow能否作为D6-D7工作流基准_调研.md
    tier: local-only
    fails: [C2]
    why: 含对面仓库 ADR 内情、其失效条件原文与跨仓复核记录 (他方未发表)
  - path: docs/2026-09-23_Ds工作区扫描_对agent编排与D7的可借鉴分析.md
    tier: local-only
    fails: [C2, C3]
