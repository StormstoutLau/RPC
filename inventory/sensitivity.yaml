  - path: spec/d6-agent-standard/test-cards/
    tier: local-only
    fails: [C3]
    why: >-
      卡面含 proj 路径 / 站标识 / 站上落点 ⇒ 按目录整体 local-only
  - path: spec/d6-agent-standard/dogfood-cards/
    tier: public
    fails: []
    why: >-
      ★ 吃狗粮卡面**专用目录** (Scott 2026-09-24 裁定) —— 与 test-cards/ 分开, 因后者含站标识/站上落点。
      本目录的卡面必须**正文零 C3 指纹**(不写 IP/主机名/Linux 绝对路径/用户名; accept 用相对路径),
      否则"声明 public 出网"就是带着指纹出。依据: 卡正文会进 prompt(实测 prompt.txt = [proj:] + task 行 + 正文全文);
      front-matter 的 accept 不进 prompt, 且 accept 由站上执行前已 cd "$W" ⇒ 不必写绝对路径
  - path: spec/d6-agent-standard/dogfood-cards/inputs/d7-dialect-excerpt.md
    tier: public
    fails: []
    why: >-
      B1(U-2 方言映射) 的输入。由 local-only 文档**人工摘录 + 脱敏**(Scott 2026-09-24 裁定 B1 = public + 摘要):
      只保留"符号 → 阶段/档位含义"的抽象对照, 已剔除主机名/IP/用户目录/源码标识符/行号/键名。
      ⚠ 它不承载原文档的完整性 ⇒ 卡面已明写"缺失项就是缺失, 不许补"
  - path: inbox/
