# ── 常被卡引用的契约/载体文档 ──
contracts:
  - path: docs/三机推理集群使用手册.md
    tier: local-only
    fails: [C3]
    why: 含站 IP / 主机名 / 端口映射 / 内部流程节点 —— 属基础设施指纹
  - path: spec/d6-agent-standard/CROSS-PROJECT-WORK-STANDARD.md
    tier: sanitized
    fails: [C3]
    why: 工作流面契约本身可公开; 但含站 IP 示例与本地端子 (需脱敏)
  - path: spec/d6-agent-standard/test-cards/
    tier: local-only
    fails: [C3]
    why: 卡面含 proj 路径 / 站标识 / 站上落点 ⇒ 按目录整体 local-only
  - path: inbox/
    tier: local-only
    fails: [C2]
    why: ★ 理由不是"本仓私有", 而是**承载他方未发表内容** (Paper / Auto_Prover 的稿件与裁决材料)
  - path: secrets/
    tier: local-only
    fails: [C3]
    why: 真实凭据 (scrubber 只兜 sk- 类, 不该赌)

