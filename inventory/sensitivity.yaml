# 内容 sensitivity 真值表 (2026-09-23 新建; 待裁 37 的落地)
#
# 为什么有这张表: D6/D7 的调研与路线文档含三类内容, 而**卡**的 `sensitivity` 是
#   **卡作者的声明**, 不是**内容的属性** —— 闸只看声明, 看不到"这份输入实际是什么"。
#   实测两条: ① `if (-not $sensitivity) { $sensitivity = 'public' }` (agent-cli.ps1:445)
#              ⇒ **不写 = 默认放行**;
#            ② `Test-CardSafetyDeclared` 明记"无 front-matter 卡会静默退化 ⇒ sensitivity 默认 public"
#              (agent-cli.ps1:784-786) ⇒ **"漏标"的方向是"更宽松"**。
#   ⇒ 本表把"内容 → 档位"从**口头判断**变成**可查真值**, 供卡面 `input-provenance` 引用。
#
# ── ⚠⚠ `sanitized` 的**实际保护范围**（2026-09-24 一手核对, 防误读）────────────────
#   `sanitized` = C1 ∧ C2 ∧ ¬C3 档, 其"脱敏"由 `agent-cli.ps1` 的 `Invoke-Scrubber` 实现
#   （规则单一真值源 = `Get-ScrubRules`, 9 条）。**实测射程与"脱敏后出"这句并不等宽**：
#     · **只作用在 `$promptFull`**（卡正文 + 附件**文件名**）—— **accept 命令与附件内容都不经它**
#       （附件走 scp 原文; 见 docs/security/2026-09-21_scrubber规则扩充裁定与影响面.md §2.2）;
#     · 9 条规则 = 私钥块(拒发) / GH-PAT / AWS-AK / Slack / JWT / `sk-` / `Bearer` / email / Windows 路径;
#     · ★ **刻意不含**: 内网 IP · `.local` 主机名 · **Linux 绝对路径** · UNC · 用户名 · 手机号 ·
#       身份证 · 银行卡（理由: 前三类是项目自身日常寻址方式, 抹掉=抹掉任务可执行性; 那类的正确防线
#       是**档位**, 不是正则 —— 裁定原文）。
#   ⇒ ⇒ **结论（写死在此, 不许再含糊）**: `sanitized` **对 C3 类不提供保护**（IP/主机名/Linux 路径/
#      用户名会原样出网）; 它只兜"有固定格式前缀的凭据类"。
#      **含 C3 的内容不得靠 `sanitized` 兜底** —— 要么人工剔除后按 `public` 走, 要么按 `local-only` 走。
#
# ── 判定规则 (fail-closed; 三条充分条件须【全部满足】才可升为 public) ──
#   C1 不含用户未发表论文 / 未发表研究内容
#   C2 不含他方项目的未发表内容 (Paper / Auto_Prover / Cpp_Hub 的稿件·裁决材料·内部实现)
#   C3 不含基础设施指纹 (IP / 主机名 / 端口映射 / 凭据形态 / 内部流程节点)
#
#   档位取值 (与 agent-cli.ps1 route `--Sensitivity` 三档一致: public|sanitized|local-only):
#     public      = C1 ∧ C2 ∧ C3        直接可出网
#     sanitized   = C1 ∧ C2 ∧ ¬C3       可出网, 仅当敏感项是**凭据类**时"脱敏后出"（⚠ 见上节: 对 C3 无保护）
#     local-only  = ¬C1 ∨ ¬C2           字节永不出主控站 (站内模型; O-16 血泪的适用范围)
#     unverified  = 尚未逐份核验 ⇒ **按 local-only 处置** (fail-closed; 不许默认放宽)
#
# ── 卡的义务 (CROSS-PROJECT-WORK-STANDARD §4 "统一任务卡契约") ──
#   卡声明 `sensitivity: public` 或 `sanitized` **且带输入** (`input-provenance` 非空) 时:
#     ① `input-provenance` 必填, 逐项列出输入路径 (本仓相对路径);
#     ② 每个路径必须在本表里有 `tier`;
#     ③ 卡的 `sensitivity` **不得宽于**表里对应项的 `tier` (顺序 local-only < sanitized < public)。
#   ⇒ 该规则**可机判**; 断言接入见文末 "待接入" 段。
#
# ── 其它两条**卡面/传输**纪律（2026-09-24 一手取证; 详见 spec/d6-agent-standard/dogfood-cards/README.md）──
#   · **卡正文会进 prompt**（实测 `prompt.txt` = `[proj:x]` + task 行 + 正文全文）⇒ 走出网档的卡,
#     其**正文不得含 C3 指纹**; front-matter 的 `accept:` 不进 prompt, 且 accept 由站上执行时
#     已 `cd "$W"` ⇒ 不必写绝对路径。
#   · **附件内容不经 scrubber**; 带附件 + 出网后端 + 卡未写 `attach-egress: ok` ⇒ `REJECT … exit 4`。
#
# 维护: 新增/修改 D6·D7 文档时同步本表; 档位只由 Scott 裁定 (本表不给"建议档位")。
# 真值表家族: impact.yaml (影响面) / models.yaml / net.yaml / ops.yaml / plugins.yaml / ports.yaml
#           + **本表 (内容可去哪)** —— 前者管"改这里会动到谁", 本表管"这份内容能去哪"。
# ⚠ 2026-09-24: 本表此前**从未被任何工具解析过**(门禁 `syntax` 不覆盖 yaml) ⇒ 首次 `yaml.safe_load`
#   即报 `ScannerError`（多处 `why:` 纯量里含 `: `）⇒ 已按合法 YAML 重写(改折叠块)并验证通过。

