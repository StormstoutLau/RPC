  - {id: paper,           label: Paper,           status: active, since: 2026-09-26, aliases: [Paper]}
  - {id: textbook,        label: Textbook,        status: active, since: 2026-09-26, aliases: [Textbook]}
  - {id: open_data,       label: Open_Data,       status: active, since: 2026-09-26, aliases: [Open_Data]}
  - {id: macro_data,      label: Macro_Data,      status: active, since: 2026-09-26, aliases: [Macro_Data]}
  - {id: fin_agent,       label: Fin_Agent,       status: active, since: 2026-09-26, aliases: [Fin_Agent]}
  - {id: cpp_hub,         label: Cpp_Hub,         status: active, since: 2026-09-26, aliases: [Cpp_Hub]}
  - {id: spec_workflow,   label: Spec_Workflow,   status: active, since: 2026-09-26, aliases: [Spec_Workflow]}
  - {id: factor_pipeline, label: factor_pipeline, status: active, since: 2026-09-26, aliases: []}
  # ── 本仓（同一个仓的两个取值域：正式产物 vs 受理区）──────────────────────────────
  - {id: rpc,             label: 本仓 RPC,         status: active, since: 2026-09-26, aliases: [RPC]}
  - {id: rpc_inbox,       label: 本仓 inbox,       status: active, since: 2026-09-26, aliases: []}
