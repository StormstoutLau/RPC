  - {id: paper,           label: Paper,           status: active, since: 2026-09-26, aliases: [Paper],           identifier_rule: unset,     version_rule: semver-0.0.0-fallback, coord_note: "本仓尚无该项目的 U-1 产物（坐标待它首次发身份时定）"}
  - {id: textbook,        label: Textbook,        status: active, since: 2026-09-26, aliases: [Textbook],        identifier_rule: composite, version_rule: semver-0.0.0-fallback, coord_note: "code + statement + mathlib_ver + lean_ver（多字段复合）"}
  - {id: open_data,       label: Open_Data,       status: active, since: 2026-09-26, aliases: [Open_Data],       identifier_rule: biz-key,   version_rule: semver-0.0.0-fallback, coord_note: "源 + 维度 + 日期（该项目自有主键）"}
  - {id: macro_data,      label: Macro_Data,      status: active, since: 2026-09-26, aliases: [Macro_Data],      identifier_rule: biz-key,   version_rule: semver-0.0.0-fallback, coord_note: "full_url（该项目自有主键）"}
  - {id: fin_agent,       label: Fin_Agent,       status: active, since: 2026-09-26, aliases: [Fin_Agent],       identifier_rule: biz-key,   version_rule: semver-0.0.0-fallback, coord_note: "text（该项目自有主键）"}
  - {id: cpp_hub,         label: Cpp_Hub,         status: active, since: 2026-09-26, aliases: [Cpp_Hub],         identifier_rule: unset,     version_rule: semver-0.0.0-fallback, coord_note: "本仓尚无该项目的 U-1 产物（坐标待它首次发身份时定）"}
  - {id: spec_workflow,   label: Spec_Workflow,   status: active, since: 2026-09-26, aliases: [Spec_Workflow],   identifier_rule: unset,     version_rule: semver-0.0.0-fallback, coord_note: "本仓尚无该项目的 U-1 产物（坐标待它首次发身份时定）"}
  - {id: factor_pipeline, label: factor_pipeline, status: active, since: 2026-09-26, aliases: [],                identifier_rule: biz-key,   version_rule: semver-0.0.0-fallback, coord_note: "id（该项目自有主键）"}
  # ── 本仓（同一个仓的两个取值域：正式产物 vs 受理区）──────────────────────────────
  - {id: rpc,             label: 本仓 RPC,         status: active, since: 2026-09-26, aliases: [RPC],             identifier_rule: relpath,   version_rule: semver-0.0.0-fallback, coord_note: "仓内相对路径（如 `inventory/edges.yaml`）"}
  # ★ `rpc_inbox` 的坐标 = `U1#7`（2026-10-19 裁）的口径；⚠ **不含受理目录**（残余见 spec 未实测 7 的残余段 /
  #   台账 `O-162` ①：2026-10-20 取证为**本机正常时钟下不可达**，真实风险 = 依赖 `Get-UniqueRunStamp` 的全局抢占
  #   这一**隐藏前提** ⇒ 口径维持，前提写进 spec 与台账）。
  - {id: rpc_inbox,       label: 本仓 inbox,       status: active, since: 2026-09-26, aliases: [],                identifier_rule: relpath,   version_rule: semver-0.0.0-fallback, coord_note: "清单数据行的相对路径（相对清单头声明的「项目根」）· `U1#7` 2026-10-19 裁定"}
