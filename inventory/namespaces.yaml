# U-1 命名空间注册表（`U1#5` · 2026-10-01）
#
# ── 这是什么（**唯一真值源**）──────────────────────────────────────────────
# **产物身份里 `namespace` 的取值域**。真值**只在本文件**，消费者（门禁 / 脚本）**只读它**。
#
# ── 为什么把它从 `dialect.yaml` 里剥出来（`U1#5` 的处置）────────────────────
# 原状：U1 spec §1.3 把取值域指向 `inventory/dialect.yaml` 的 `namespaces[].id` —— 而 `dialect.yaml` 自称
#   **生成物**（「**禁止手工编辑语义** —— 一律改源头 → 重抽 → 跑门禁」，见其头部），且已登记 `check: dialect`。
# ⇒ ★★ **两条纪律互斗**：U1 说"新增 namespace = 去改那个取值域"，而 dialect 说"这份文件不许手改"。
#    ⇒ 结果是**没有任何合法的新增路径**（改文件 = 违反生成物纪律；走重抽 = 源里根本没有 namespace 这一节）。
# ⇒ 处置（2026-10-01，用户裁）：**把取值域剥成一个独立真值文件**（= 本文件），`dialect.yaml` 改为**指向它**。
#
# ── 治理规则（三条，都可机判；门禁 = `u1-identity` 的判据 ④）──
# ⚠ **2026-10-20 更正（`O-162` 顺带查出）**：本行原写作「判据 ④ + **`namespace-registry`**」——
#   而**那半句是假的**：**更正前**全仓 `grep namespace-registry` **只有本行这一处**（更正文本本身当然也含该串），门禁 id 实际只有
#   `dialect` / `u1-identity` / `id-storage` / `edges` / `inbox` / `projects`
#   ⇒ 它**声称了一个不存在的判据**（同族：标签比事实硬）。改为逐字写下真实落点。
# ① **新增权**：只能向本文件追加一条（`status: active`）。**门禁不看人，只看登记** ——
#    未登记 / `retired` ⇒ **拒**（fail-closed）。
# ② **冲突裁**：`id` **先到先得**；`aliases` 只用于**承接历史/别处写法**（如 `Open_Data` 是 `open_data` 的别名），
#    ★ **同一个字符串不许同时是两条的 id 或 alias**（唯一会判红的冲突）。
# ③ **退役**：改 `status: retired` 而**不删**（删了就无法解释历史身份）；退役后**旧身份仍可复算**，但**新声明不许用**。
#
# ── 与身份的关系（要紧，别读成"别名也能写进身份"）───────────────────────────
# ★ **身份里只许写 canonical `id`**。写 alias ⇒ **拒**（判据给"应改为 `<id>`"的提示）。
#   理由：身份是 `sha256(["<namespace>", "<identifier>", "<version>"])` ⇒ **哈希吃的是原字符串** ——
#   若 `open_data` 与 `Open_Data` 都放行，同一个产物会有**两个身份**（= U-2 那条"同一事实多处表达"，代价最大的一种）。
#   ⚠ 故别名的**匹配是精确的**（不做大小写/分隔符归一）—— 归一化会把"两个身份"藏起来。
# ★ `aliases` 的**用途**只有两个：① 让**消费侧**（如 `ops/id_storage_census.py` 的 `项目 → namespace`）能把
#   历史写法解析回 canonical id；② 让**冲突**可判（同一个串不能属于两条）。

version: 1
updated: 2026-10-20
owner: Scott (鹏)

# ── 白名单（`status` 闭集：active | reserved | retired）──────────────────────
# `since` = 该 id **开始生效**的日期（不是"最近改动日"）。
# ── ★★ 坐标语义（`identifier_rule` / `version_rule`）＝ `O-162`（2026-10-20 裁「进注册表字段」）──
# **判据 ④ 问的是"能不能用这个 ns"（取值域）；本组字段问的是"这个 ns 的 `identifier` / `version` 怎么算"。**
# 此前它**只在 spec §1.3 的 prose 里**（"既有各处可无损映射"）⇒ **不是判据**，每处各自拼三元组，
#   且新增一个 namespace 时**没人逼它定语义**。⇒ 现搬进本文件（**语义的真值只在这里**，spec §1.3 指向它）。
# `identifier_rule` ∈
#   · `relpath`   —— 一条**相对路径**（`rpc` = 仓内相对路径 · `rpc_inbox` = 清单数据行的相对路径）
#   · `biz-key`   —— **该项目自有的业务主键**（细则归该项目自身口径，本仓**不替它重定义**）
#   · `composite` —— **多字段复合**（如 Textbook：code + statement + mathlib_ver + lean_ver）
#   · `unset`     —— **尚无 U-1 产物 ⇒ 坐标未定**（★ **必须**写 `coord_note`，否则"没定"是无声的）
# `version_rule` ∈
#   · `semver-0.0.0-fallback` —— §1.3 既有规则：语义化版本；**无版本者写 `0.0.0`**
#   · `unset`                  —— 同上（须 `coord_note`）
# ★★ **机判落点**（`ops/rpc_check.py` 的 `validate_namespace_coords`，门禁 `u1-identity` **判据 ⑤**）：
#   ① `status: active` 的每条**必须**登记本组字段（缺 / 闭集外 ⇒ FAIL）· ② `retired`/`reserved` **不强制**；
#   ③ ★ **已在用**（`inventory/*.yaml` 里有它的 `u1:` 声明）却登记成 `unset` ⇒ **FAIL**
#   ⇒ 这就是"**新增一个 namespace 时被迫定语义**"的机械落实。
# ⚠ **射程如实**：判据判的是**登记完整性**（有没有登记 · 值在不在闭集），**不是语义正确性** ——
#   后者无法机判，别把它的绿读成"坐标语义已验证"。
namespaces:
