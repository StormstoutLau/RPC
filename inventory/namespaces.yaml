  - id: auto_prover
    label: Auto_Prover
    status: active
    since: 2026-10-01
    aliases: [Auto_Prover]
    note: >-
      ★ **补登理由**：`U1#5` 普查时实测 —— `Auto_Prover` 在 `inventory/id-storage-census.yaml` 里
      **有 2 处存储登记**（`verdicts.db` / `verdicts_*.jsonl` 等），却**不在**取值域里
