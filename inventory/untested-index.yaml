# 未实测登记 · 可机读索引（D6/D7 规范面）
#
# ── 这是什么 / 不是什么 ────────────────────────────────────────────────────
# 本文件是 6 份规范文档 `## 未实测登记` 节的**分诊索引** —— 目的是把「这些未实测项
# 该谁做 / 卡在哪」从"**全靠人读**"变成**可机读**。
# ★★ **2026-09-30（`O-123`）起本文件已有消费者 —— 它不再是叶子节点**：
#   门禁 `spec-untested`（`ops/rpc_check.py` 的 `check_spec_untested` / `summarize_untested_triage`）
#   会**读本文件的分诊**：① **报数**（state / blocker / needs_decision 分布进门禁 note）；
#   ② **一条判据** —— 任一条 `needs_decision: true` ⇒ **WARN**（口径 =「**未裁项不许静默**」）。
#   ⚠ **射程（如实，别读过头）**：门禁**不判**分诊写得对不对，也**不重做**本文件的对账/闭集校验
#     （那是 `tests/test_untested_index_sync.py` 的职责 —— 判据只在一处）。
#   ⚠ 在此之前（2026-09-30 之前）门禁 `spec-untested` **只**判"那一节在、且非空"、**不判**条目分诊。
#   ⚠⚠ **射程之二（2026-10-03 新登记 ⇒ 见 `O-144`）—— `needs_decision` 的取值来源【只有规范文档措辞】**：
#     它的定义是「**仅当文档明写**「未裁 / 未定 / 待裁」」（下方第 33 行）⇒ ★ **台账
#     （`spec/d6-agent-standard/OPEN-ISSUES.md`）里写的"待裁"结构性地反映不到这里**。
#     ⇒ ★★ 因此 **`needs_decision: 0` ≠「本仓没有待裁项」**。**实测（2026-10-03）**：台账仍在 5 条里有
#     `O-135` / `O-136` **明写"三处待裁"**（灰度门槛 / `PRH` 定档 / `seq` 语义），而 `D7-PROTOCOL-CONTRACT`
#     的索引条目**正引用** `refs: [O-136]` 却仍是 `needs_decision: false`
#     ⇒ **同一批"未裁"在【台账】与【本索引分诊】里表达不一致** = 本仓"同一事实两处定义"的又一实例。
#     ★ `blocker` 闭集**有** `decision`（待人裁定）取值，但那是**人工判读**（下方第 44 行）⇒ 同样可能与台账不一致
#     （实测分布：**`decision = 0`**）。⇒ **口径**：本文件的射程 = **spec 文档面**；**跨面的"待裁"须查台账本身**。
#     ⚠ **本段只登记射程 —— 不改任何字段值、不改门禁判据**（粒度更高的一致化 = `O-144` 的待裁项）。
#
# ★ 真值源分工（**不造第二份真值**）：
#   · **条目的存在与编号** ⇒ 真值在**各规范的 `## 未实测登记` 节**（本文件**不得**增删条目）；
#     由 `tests/test_untested_index_sync.py` **双向对账**（编号集合相等）+ 字段闭集校验。
#   · **分诊字段**（`state` / `needs_decision` / `refs` / `blocker`）⇒ 真值**只在本文件**
#     （各规范节里**不写**分诊 ⇒ 不存在"同一事实两处表达"）。
#
# ⚠ 本文件**不是生成物**（分诊是人工判断）⇒ **故意不登记** `inventory/artifacts.yaml`
#   （那张表是"权威源在别处、**禁止手工编辑**"的生成物清单，语义与本文件相反）。
# ⚠ 本文件**不写死任何计数**（本仓教训：**标签比事实硬**）—— 计数由同步测试**算出来打印**。
#
# 字段：
#   spec           : 规范文件名（不含 .md）
#   n              : 该节里的**条目编号**（**原样** —— 含已被划掉的编号：编号刻意保留，因别处按编号引用）
#   gist           : 条目要点（**索引用的压缩**，非原文；原文见该规范对应条目）
#   state          : 闭集 { todo | partial | retired | boundary }
#                      todo     = 未消掉（**含"未定 / 未裁"**）
#                      partial  = 文档**明写**"部分消掉 / 已收紧"
#                      retired  = 文档**明写**"已消掉"
#                      boundary = 文档**明写**"已知能力边界，不是待办"
#   needs_decision : true **仅当**文档明写「未裁 / 未定 / 待裁」（其余 false —— **不推断**）
#   refs           : 条目文本里**显式出现**的 O-/D- 编号（没写就是 [] —— **不推断**）
#   blocker        : ★ 2026-09-30 新增（`O-123`）：答案 = 「**卡在哪**」—— 现行 `state` 记不出
#                      「**没跑**」与「**没实现**」之别，而两者成本差一个数量级（抽样已证
#                      `D7-PROTOCOL-CONTRACT` 9 条**全 `implementation`**：`RunReport` / `l1_results`
#                      在 `ops/` **零命中**）。闭集 { run | implementation | decision | external | none }：
#                      run            = 需**真跑 / 实测**（对象在站上，或需运行时）
#                      implementation = 需**写代码 / 建机制**（能力尚未实现）
#                      decision       = 待**人裁定**（值 / 规则未定）
#                      external       = 卡在**本仓之外**（上游 / 别项目 / 等外部动作）
#                      none           = **不待外部动作**（`boundary` 能力边界 / `retired` 已消掉）
#                      ⚠ **不推断**：取值是人工判读该条目**下一步动作的最近阻碍**（一条可有多重阻碍，取最近的那个）。
#                      ⚠ **不放阈值/计数**（同 `state`：**标签比事实硬**）；分布由同步测试**算出来打印**。

