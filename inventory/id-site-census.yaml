# ID 站点普查真值（**可复算**）—— 口径 / 范围 / 数值三件套
#
# 生成：`py ops/id_site_census.py --emit`   ·   复算比对（门禁）：`id-census`
# 口径的**唯一实现**在 `ops/id_site_census.py`；本文件只是它的一次输出快照。
# ⚠ 读法：`hits` = 命中**行数**，**不等于**「产物 ID 的处数」——
#   它只回答「有多少处哈希用法」；「哪些是产物 ID」是 U-4 的 `affected`，仍未解。
metric:
  name: id_site_hit_lines
  unit: 命中行数（一行内多个匹配只计 1）
  regex: hexdigest\(\)|md5\(|sha256\(|sha1\(
  glob: '*.py'
  exclude_dirs:
  - .git
  - .venv
  - __pycache__
  - archive
  - node_modules
  - site-packages
  - tests
  - venv
  exclude_tests: true
