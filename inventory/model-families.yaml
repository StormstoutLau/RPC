# ============================================================================
# 模型**家族**表（`D7-P3-1` 前置 · 2026-09-26 登记）
#
# 为什么要这张表:
#   `D7-P0-3` 的判据 **J-1（跨族）** = `lookup_family(judge.model) != lookup_family(producer.model)`
#   —— 它要的是"**判官与产出者不是同一族**"（异构的价值在"认知多样性"而非同族多实例）。
#   ⚠ 而 J-1 在此之前**不可判**：因为**没有"模型 → 家族"这张表**（路线总表 `D7-P0-3` 原文：
#     "① 有 4 族实测但**未落表**"）。⇒ 本表就是把它落下来。
#
# ★★ 族的划分依据（**唯一口径，不许换**）：
#   **按【权重血统】判** —— 即"这个模型的权重从哪个基座来"，**不是**按发布者/托管者。
#   理由：J-1 的目的是"跨族 ⇒ 认知不相关"；**蒸馏/微调会把基座的偏差一起继承**
#   ⇒ 按血统判才是"真的不同族"。⇒ 微调者 / 蒸馏者 / 量化者一律记进 `note`，**不改族**。
#   例：`gpt-oss-120b-fable-5-distilled`（`autotrust/…Fable-5-Distilled-GGUF`）**归 `gpt-oss`**
#       —— 它是 gpt-oss 的**蒸馏**，血统仍是 OpenAI 的 gpt-oss。
#
# ★★ **本表刻意不复制模型清单**（防"同一事实两个定义点"，O-50 纪律）：
#   `members` 里写的 `alias` **就是** `inventory/models.yaml` 的主键 ⇒
#   门禁 `model-families` **双向对账**（见下），**任何一侧新增都会被点名**。
#
# 门禁怎么用它（`ops/rpc_check.py` 的断言 `model-families`）:
#   ① 本表可解析；② 每个 `members` 里的 alias **必须**在 `models.yaml` 里存在（否则 = 孤儿引用）；
#   ③ **`models.yaml` 的每个 alias 必须恰好属 1 族**（漏项与重复**都会红** —— 只做单向包含
#      会漏掉"新模型没归类"，那正是本表最容易腐化的方向）；
#   ④ 每族**必须有非空的 `basis`**（族划分依据）⇒ 堵"看着像就填"（与 `dialect.yaml` 同纪律）。
#
# ⚠⚠ 一个**必须说清**的语义边界（否则会被读过头）：
#   `models.yaml` 的 `stations` = "该别名在**哪些站的模型库里**"（可加载），
#   `conf` = "哪些站**配过实例**" —— ★ **两者都不等于"已加载/正在服务"**。
#   `D7-P0-3` 的 J-1 要的是后者（**站↔已加载模型**）⇒ **本表不提供它**，见文末 `loaded_state`。
#
# 数据来源: 由 `inventory/models.yaml`（2026-09-14 三站实测 · updated 2026-09-16）的 12 个 alias
#           **逐条按 engine_id 判血统**得出（2026-09-26）。
# ============================================================================
version: 1
updated: 2026-09-26

families:
  - id: gpt-oss
    basis: OpenAI 开源权重（gpt-oss 系列）
    members: [gpt-oss-120b, gpt-oss-20b, gpt-oss-120b-fable-5-distilled]
    note: "`fable-5-distilled` 由 `autotrust` 蒸馏、`20b` 是缩小版 ⇒ **血统同族**（按依据判，不按发布者）"
  - id: nvidia
    basis: NVIDIA 自研权重（Nemotron 系列）
    members: [nvidia-nemotron-3-super-120b-a12b]
  - id: deepseek
    basis: DeepSeek 自研权重
    members: [deepseek-v4-flash-0731]
  - id: qwen
    basis: 阿里 Qwen 系权重（含其社区微调，血统未变）
    members: [qwen3.8-27b-mtp, qwen3.8-flash-next, qwen2.5-7b-instruct, qwen3-coder-next, davidau-q38-27b-q4k]
    note: "`qwen3.8-27b-mtp` 由 `Jackrong` 微调、`davidau-q38-27b-q4k` 由 `DavidAU` 微调 ⇒ 微调者记此、**不改族**"
  - id: minimax
    basis: MiniMax 自研权重
    members: [m27-q4ks]
  - id: sentence-embedding
    basis: 句子嵌入模型（**非生成模型**，用于向量检索而非判官/产出）
    members: [all-minilm-l6-v2-embedding]
    kind: embedding

# ── 站↔**已加载**模型（J-1 的第二个输入）—— ★ **2026-09-26 已实测；结论 = 它是【运行时状态】** ──
#
# ★★ 实测结论（只读探测，三站均可达）：
#   · 站 A `scott-lau-NEX` / 站 B `scott-lau-GTR-Pro` / 站 C `seaviv` —— **均可达**；
#   · `ps -eo args | grep -E 'llama-server|llama_server|lmstudio|vllm|opencode'` ⇒ **三站全空**
#     ⇒ ★ **当前没有任何模型实例在服务**（⇒ "已加载" = **空集**）。
#     ⚠ 措辞要精确：**不是"三站没有模型"** —— 权重都在盘上（`models.yaml` 的 12 个 alias），
#       只是**没在跑**。
#   · `ls /etc/llama-instances/*.env` ⇒ A **3** 个 / B **10** 个 / C **5** 个
#     ⇒ 那是 **`conf`（配过实例）**的真值源，**不是"已加载"**。
#
# ★★ 所以本轮**刻意不登记静态表**：`loaded` 是**运行时状态**（随启停变），登记成真值表**会立刻过期**，
#   而"过期但看起来像真值"的登记正是本仓最防的形态。⇒ 只登记**口径 + 实测基线**（可复算）。
#
# ★ 顺带取得一条**独立验证**（正面结果）：站上 `*.env` 与 `models.yaml` 的 `conf` 字段**对得上** ——
#   · A 站 env: gpt-oss-120b / m27-q4ks / qwen3.8-flash-next ⇒ 与 `conf` 含 A 的三条**正好一致**；
#   · C 站 env: gpt-oss-120b / m27-q4ks / qwen3.8-27b-mtp / qwen3.8-flash-next / nvidia-nemotron-3-super-120b-a12b
#     ⇒ 与 `conf` 含 C 的四条（+gpt-oss-120b）**正好一致**。
#   ⇒ `conf` 字段**被三站实测独立验证**（不是自洽）。
#   ⚠ 过滤项：`ttl.env` / `nodes.env` / `chat-templates` **不是模型** ⇒ 计数与对账时必须排除
#     （`models.yaml` 的 `known_issues` 已单列 `nodes` 为 non_model_conf）。
linked_state:
  status: runtime-not-truth-table        # ★ 不是 unverified 了：**已实测**，结论是"它属运行时"
  measured_at: "2026-09-26"
  baseline:
    stations_reachable: [A, B, C]
    serving_instances: []                # 三站进程表全空 ⇒ 当前**无实例在服务**
    conf_env_counts: {A: 3, B: 10, C: 5}
  probe:                                 # ★ 可复算口径（下次直接跑这条即可）
    loaded: "ps -eo args | grep -E 'llama-server|llama_server' | grep -v grep"
    conf: "ls /etc/llama-instances/*.env   # ⚠ 排除 ttl.env / nodes.env / chat-templates 等非模型项"
  next: |
    若要把 J-1（跨族）真正判起来，需要的是"**某次派发时 judge 与 producer 各自在跑什么**"，
    而那是**每次派发的运行时事实**（应当由派发链路自己记进 run.json，而不是由本表提供）。
    ⇒ 本表**只留口径与基线**；`D7-P3-1` 的实现侧应把这两个字段写进 run.json 的判据输入。
