# inventory/inbox.yaml — 受理状态机「单一真值源」(ADR-0008)
# ---------------------------------------------------------------------------
# 依据: ADR-0008 + inbox/README §3 状态机
# 消费方 (D6-P1-2 M-5/M-6: 收敛后代码/文档都消费这里, 不再各抄一份):
#   · ops/rpc_check.py   —— check_inbox(状态白名单) + check_mirror(本文档 ↔ README §3 对账)
#   · ops/cluster_web.py —— _collect_inbox(状态→下一动作 + 待办分组)
# ⚠ 改状态**只改这里** —— 别在代码/文档里再抄一份(本仓最大的漂移源, 门禁会点名)。
#
# 字段: group ∈ {action, active, closed}
#   action = 需需求方/管理员动作(高亮) · active = 进行中 · closed = 已关闭(折叠)
#   缺失 group ⇒ 会静默落进 closed（真静默缺口）⇒ 门禁 FAIL。
# 字段: next = 该状态的下一动作(待办聚合用, 人读文本)
states:
  open:                   {group: active, next: "待管理员初筛 → 产出 10_admin/裁决报告.md"}
  triage:                 {group: active, next: "核对 DR/CR/接口 → 产出 10_admin/裁决报告.md + 受理决定.md"}
  waiting:                {group: action, next: "等需求方补充 / 外部条件；解除后 → 产出 10_admin/裁决报告.md"}
  accepted:               {group: active, next: "产出 20_plan/ 派发计划(含容量预估) → 交需求方复核"}
  plan-review:            {group: action, next: "等需求方复核意见(10_admin/复核意见-N.md)"}
  plan-revise:            {group: active, next: "按复核意见修订 20_plan(版本 vN) → 再交复核"}
  running:                {group: active, next: "机群执行中(观测见「Agent 任务」卡片)"}
  release:                {group: action, next: "已交付证据束，等需求方验收签收"}
  done:                   {group: closed, next: "运维已结案(artifact 冻结)"}
  accepted-by-requester:  {group: closed, next: "需求方已验收签收"}
  rejected-by-requester:  {group: closed, next: "需求方拒收 / 终止"}
  rejected:               {group: closed, next: "已驳回 / 暂缓"}
