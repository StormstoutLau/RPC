# u1:sha256:32
# U-2 证据强度字典 + 方言映射表（D7-P1-1）
#
# ── 这是什么 ───────────────────────────────────────────────────────────────
# U-2 的目标是「**建映射、不迁移权威源**」：同一个符号（如 `L1` / `A` / `R1` / `E1`）
# 在九个项目里指互不相干的东西。本文件把「**符号 × 出处 → 该处含义**」摊平，
# 并把可归入**同一条轴**的那些含义钉到轴上；归不进去的**显式登记为未定轴**，不硬塞。
#
# ── 权威源在别处 ⇒ 本文件是「生成物」───────────────────────────────────────
# 符号定义的真值在**各项目自己的仓库**里；本文件是它的**投影**。
# ⇒ 已登记进 `inventory/artifacts.yaml`（`check: dialect`）。纪律见该文件头部：
#   **生成物禁止手工编辑语义** —— 一律「改源头 → 重抽 → 跑门禁 `dialect`」。
#   本文件**没有**可重跑的生成器（重抽是人/agent 在环，见末节 `regeneration`）；
#   门禁能做的就是**把你漏掉的那一步抓住**：源切片指纹一变 ⇒ 红（见 `sources`）。
#
# ── 两层输入（同一事实的两个来源，故意都留）────────────────────────────────
#   · `survey-11-1`     = 合并稿 §11.1 原文切片（`local-only` 文档；`b1a` 转录层的输入）
#   · `dialect-excerpt` = 已人工脱敏的出站版摘要（`public`；`b1b` 分析层的输入）
#   两层都留的理由：**底稿求真、分析求用**（裁定见 DEV-LOG-014 D1）；
#   `b1b` 的产物实测**漏了摘要族 2 的第三行**（`Cpp_Hub` 平台支持档位）——
#   本表的 `coverage` 段就是为这一类漏项设的机判（见下）。
#
# ── 本文件**不含**的东西（刻意）────────────────────────────────────────────
#   · 不写任何盘符 / 主机名 / IP / 用户目录（出处一律用**项目名**；盘符形态只在 `b1a` 底稿里）
#   · **不**给出摘要没有的含义（`b1b` 曾把 RPC 的 E1–E5 写成「官方>社区>实测>推断>无据」——
#     那**不在**摘要里，本表按未定登记，见 `rpc:RPC-E*` 行）

version: 1
updated: 2026-09-26
owner: Scott (鹏)

# ── 本文件自己的 U-1 产物身份（D7-P1 实现侧：U-1 落地的**第一个真实声明**）──────────
# ★ 四项取值 + 复算规则的真值在 `spec/d6-agent-standard/U1-ARTIFACT-IDENTITY.md`；
#   算法/截断/规范化输入的唯一**实现**在 `ops/rpc_check.py` 的 `u1_identity()`（门禁与产出方同源）。
# ⚠ **改本文件不影响本身份** —— 身份由 `(namespace, identifier, version)` 三元组决定，
#   而**不是**文件内容哈希（`identifier` 取**路径**，见 U1 spec §1.3 对 identifier 的定义）。
#   ⇒ 想知道"内容变了没有"要用内容哈希（`sha256`），那是**另一件事**，别把两者混为一谈。
# ⚠ **2026-09-26 重算过一次**（O-84 裁定：截断 `16` → `32`，对齐蓝本 `Open_Data`）——
#   故本行 identity 与初版不同；重算理由见 `ops/rpc_check.py` 的 `U1_TRUNC` 注释与 DEV-LOG-014 §44。
u1:
  namespace: rpc
  identifier: inventory/dialect.yaml
  version: 0.0.0
  identity: u1:sha256:32:550da5b166cb60c817d68a6948a7fe37

# ── 单一轴：证据强度 ──────────────────────────────────────────────────────
# 为什么只立这一条轴：D7-P1-1 的名字就是「证据强度字典」；且 D7 判定「这份产物算不算证据」
# 时**只有这一条轴**是跨项目可比的。其余族（阶段序 / 本体层级 / 严重度 / 优先级 / 成熟度 /
# 断言确定性 / 访问控制 / 修正动作 / 复现强度）**各自是别的轴**，硬并入会造出新冲突。
# ⚠ `partial: true` 是**如实声明**：摘要只给出了三级；本仓自己那族的逐级定义**不在**输入里。
axis:
  id: evidence-strength
  label: 证据强度
  partial: true
  why: >-
    来源强度是可跨项目比较的**一条**序；D7 用它回答「这份证据有多硬」。
    只取摘要已明确给出的三级，不强推第四级。
  values:                     # 有序：强 → 弱
    - id: official
      label: 官方来源
      note: 出处 = Open_Data 的 `L1`（原文词「官方来源级」）
    - id: community
      label: 社区来源
      note: 出处 = Open_Data 的 `L2`（原文词「社区来源级」）
    - id: measured
      label: 实测取得
      note: 出处 = Open_Data 的 `L3`（原文词「实测取得级」）

# ── 命名空间前缀（§11.4 教训③：**必填字段**，不靠人自觉写前缀）────────────
# ★★ **2026-10-01（`U1#5`）：本段已【剥出】本文件 —— 取值域的真值唯一在
#   [`inventory/namespaces.yaml`](namespaces.yaml)，本文件只做 `mapping[].namespace` 的**消费者**。**
#   **理由（两条纪律互斗，已实测）**：U1 spec §1.3 曾把身份取值域指向本文件的 `namespaces`，而本文件自称
#   **生成物**（"禁止手工编辑语义 —— 一律改源头 → 重抽"）⇒ **想新增一个 namespace 没有合法路径**
#   （改本文件 = 违反生成物纪律；走重抽 = 源里根本没有这一节）⇒ 故**取值域不该挂在派生视图上**。
#   ⚠ 搬入时**取值一字未改**（10 条原样），只增补了普查实测缺口的 `auto_prover`（见该文件内的补登理由）。
#   ⚠ 门禁 `dialect` 的白名单现从注册表读（`validate_dialect(..., reg)`）⇒ 本段不再有 `namespaces` 键。

