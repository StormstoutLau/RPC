# A3a: USB4/Thunderbolt interconnect low-latency sysctls (both nodes)
# Source: ayysasha/Strix-halo-dual-optimized (adapted), applied 2026-08-28
# Measured on this cluster: pp512 +4.1% (147.03 -> 153.00), tg128 +1.0% (20.02 -> 20.23)
# Note: busy_read/busy_poll trade fatter RTT tail (p90 +60us) for lower floor (min 52->22us);
# RPC hot path (compute-bound waits) is net-positive.
net.core.busy_read = 100
net.core.busy_poll = 100
net.ipv4.tcp_low_latency = 1
net.ipv4.tcp_fastopen = 3
